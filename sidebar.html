<!DOCTYPE html>
<html>
<head>
<title>Alert Categories Sidebar</title>
<style>
body {
    font-family: Arial;
    background-color: lightblue;
    margin: 30px;
}
h1 {
    color: red;
    text-align: center;
    background-color: lightyellow;
    padding: 15px;
    border: 2px solid red;
    border-radius: 10px;
}
.sidebar {
    width: 280px;
    border: 2px solid darkred;
    box-shadow: 6px 6px 10px gray;
    padding: 18px;
    border-radius: 12px;
    background-color: lightyellow;
}
.sidebar h2 {
    color: darkred;
    margin-top: 0;
    text-align: center;
}
.sidebar ul {
    list-style-type: square;
    padding-left: 22px;
}
.sidebar li {
    padding: 8px 0;
    font-size: 17px;
}
.sidebar li:hover {
    color: white;
    background-color: darkred;
    padding-left: 8px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>
<body>
<h1>Heatwave Alert Categories</h1>
<div class="sidebar">
<h2>Categories</h2>
<ul>
<li>North Zone Alerts</li>
<li>Central Zone Alerts</li>
<li>South Zone Alerts</li>
<li>AWS Sensor Feeds</li>
<li>IMD Bulletins</li>
<li>Citizen Advisories</li>
</ul>
</div>
</body>
</html>
