<!DOCTYPE html>
<html>
<head>
<title>Region Cards</title>
<style>
body {
    font-family: Arial;
    background-color: lightblue;
    margin: 30px;
    text-align: center;
}
h1 {
    color: red;
    background-color: lightyellow;
    padding: 15px;
    border: 2px solid red;
    border-radius: 10px;
}
.card {
    display: inline-block;
    width: 220px;
    margin: 15px;
    padding: 18px;
    border: 2px solid darkred;
    background-color: lightyellow;
    box-shadow: 5px 5px 8px gray;
    border-radius: 10px;
    text-align: center;
}
.card h2 {
    color: darkred;
    margin-top: 0;
}
.card p {
    font-size: 16px;
    line-height: 1.5;
}
.severe {
    background-color: #ffcccc;
}
.moderate {
    background-color: #fff2cc;
}
.low {
    background-color: #ccffcc;
}
</style>
</head>
<body>
<h1>Region Station Cards</h1>
<div class="card severe">
<h2>North Zone</h2>
<p>Station A1</p>
<p>Max Temp: 47 C</p>
<p>Severity: Severe</p>
</div>
<div class="card moderate">
<h2>Central Zone</h2>
<p>Station B2</p>
<p>Max Temp: 43 C</p>
<p>Severity: Moderate</p>
</div>
<div class="card low">
<h2>South Zone</h2>
<p>Station C3</p>
<p>Max Temp: 39 C</p>
<p>Severity: Low</p>
</div>
</body>
</html>
